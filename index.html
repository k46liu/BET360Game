<!DOCTYPE html>
<html lang="en">
<head>

<title>TrustFall: A Scam Resilience Simulation for Ontario</title>
<meta name="description" content="A systems-level policy simulation on scam vulnerability among older adults in Ontario. BET 360 final product by Xiwen (Kevin) Liu.">
<style>
  :root {
    --bg: #f7f3ec;
    --panel: #ffffff;
    --ink: #1f2a44;
    --muted: #5b6476;
    --line: #e2dccf;
    --accent: #c2563a;
    --accent-soft: #f6e3dc;
    --good: #2f7d5b;
    --good-soft: #e0f0e8;
    --warn: #b7791f;
    --warn-soft: #fbf0d9;
    --bad: #b23a3a;
    --bad-soft: #f7dede;
    --lvl-events: #dbe8f4;
    --lvl-patterns: #a9c7e3;
    --lvl-structures: #5b8fc0;
    --lvl-mental: #24476e;
    --radius: 12px;
    --shadow: 0 1px 2px rgba(31,42,68,.06), 0 4px 16px rgba(31,42,68,.06);
    --fs: 17px;
  }
  html { font-size: var(--fs); }
  html.size-l { --fs: 19px; }
  html.size-xl { --fs: 22px; }
  html.contrast {
    --bg: #ffffff; --panel: #ffffff; --ink: #000000; --muted: #222222; --line: #000000;
    --accent: #9e2a10; --accent-soft: #ffe9e2; --good: #0b5d3b; --bad: #8f0000;
    --shadow: none;
  }
  html.contrast .card, html.contrast .panel, html.contrast .persona { border-width: 2px; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.5;
  }
  h1, h2, h3 { font-family: Georgia, "Times New Roman", serif; line-height: 1.2; margin: 0 0 .5rem; }
  h1 { font-size: 2.2rem; }
  h2 { font-size: 1.6rem; }
  h3 { font-size: 1.15rem; }
  p { margin: 0 0 .8rem; }
  a { color: var(--accent); }
  button { font: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  main:focus { outline: none; }
  @media (prefers-reduced-motion: no-preference) {
    .fade { animation: fade .35s ease-out; }
    @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  }

  .topbar {
    position: sticky; top: 0; z-index: 10; background: var(--ink); color: #fff;
    display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    padding: .55rem 1.2rem; flex-wrap: wrap;
  }
  .topbar .brand { font-family: Georgia, serif; font-weight: 700; letter-spacing: .02em; }
  .topbar .brand span { opacity: .7; font-weight: 400; font-family: system-ui, sans-serif; font-size: .85rem; margin-left: .5rem; }
  .a11y { display: flex; gap: .35rem; align-items: center; font-size: .85rem; }
  .a11y button {
    background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.5);
    border-radius: 6px; padding: .2rem .55rem; min-height: 32px;
  }
  .a11y button[aria-pressed="true"] { background: #fff; color: var(--ink); }

  main { max-width: 1120px; margin: 0 auto; padding: 1.5rem 1.2rem 4rem; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 1.4rem; margin-bottom: 1.2rem; }
  .eyebrow { text-transform: uppercase; letter-spacing: .08em; font-size: .75rem; color: var(--accent); font-weight: 700; margin-bottom: .3rem; }
  .muted { color: var(--muted); }
  .small { font-size: .85rem; }
  .btn {
    display: inline-flex; align-items: center; gap: .4rem; border: 0; border-radius: 10px;
    padding: .75rem 1.3rem; background: var(--accent); color: #fff; font-weight: 700; min-height: 48px;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn.secondary { background: transparent; color: var(--ink); border: 2px solid var(--ink); }
  .btn:disabled { opacity: .45; cursor: not-allowed; filter: none; }
  .row { display: flex; gap: 1rem; flex-wrap: wrap; align-items: center; }
  .spread { justify-content: space-between; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1rem; }
  .grid4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 1rem; }

  .hero { display: grid; grid-template-columns: 1.3fr 1fr; gap: 1.5rem; align-items: start; }
  @media (max-width: 820px) { .hero { grid-template-columns: 1fr; } }
  .stat { border-left: 4px solid var(--accent); padding: .3rem 0 .3rem .8rem; margin-bottom: .9rem; }
  .stat b { display: block; font-size: 1.5rem; font-family: Georgia, serif; }
  .stat span { font-size: .85rem; color: var(--muted); }

  .persona { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 1rem; box-shadow: var(--shadow); }
  .persona .who { display: flex; gap: .7rem; align-items: center; margin-bottom: .5rem; }
  .avatar { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: #fff; font-family: Georgia, serif; font-size: 1.2rem; flex: none; }
  .tag { display: inline-block; font-size: .72rem; padding: .12rem .5rem; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); margin: 0 .25rem .25rem 0; white-space: nowrap; }
  .risk { font-weight: 700; font-size: .8rem; padding: .15rem .55rem; border-radius: 999px; }
  .risk.High { background: var(--bad-soft); color: var(--bad); }
  .risk.Medium { background: var(--warn-soft); color: var(--warn); }
  .risk.Low { background: var(--good-soft); color: var(--good); }

  .hud { display: grid; grid-template-columns: repeat(4, 1fr); gap: .8rem; margin-bottom: 1rem; }
  @media (max-width: 820px) { .hud { grid-template-columns: repeat(2, 1fr); } }
  .hud .box { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: .8rem 1rem; }
  .hud .label { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .hud .value { font-size: 1.45rem; font-family: Georgia, serif; font-weight: 700; }
  .hud .hint { font-size: .75rem; color: var(--muted); }
  .meter { height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; margin-top: .35rem; }
  .meter > i { display: block; height: 100%; background: var(--accent); }

  .event { background: var(--ink); color: #fff; border-radius: var(--radius); padding: 1rem 1.2rem; margin-bottom: 1rem; display: flex; gap: 1rem; align-items: center; }
  .event .icon { font-size: 1.8rem; }
  .event b { color: #ffd2c4; }

  .filters { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: .8rem; align-items: center; }
  .chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: .3rem .8rem; font-size: .85rem; min-height: 36px; }
  .chip[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }

  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem; }
  .card {
    position: relative; text-align: left; background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 1rem 1rem .9rem; box-shadow: var(--shadow);
    display: flex; flex-direction: column; gap: .45rem; color: var(--ink); width: 100%;
  }
  .card:hover:not(:disabled) { border-color: var(--ink); }
  .card[aria-pressed="true"] { border: 2px solid var(--accent); background: var(--accent-soft); }
  .card:disabled { cursor: default; }
  .card.owned { opacity: .62; }
  .card .top { display: flex; justify-content: space-between; gap: .5rem; align-items: start; }
  .card .name { font-weight: 700; font-size: 1rem; line-height: 1.3; }
  .cost { flex: none; background: var(--ink); color: #fff; border-radius: 8px; padding: .15rem .5rem; font-weight: 700; font-size: .85rem; }
  .card .desc { font-size: .88rem; }
  .who-helps { display: flex; align-items: center; gap: .3rem; flex-wrap: wrap; }
  .pdot { width: 24px; height: 24px; border-radius: 50%; display: inline-grid; place-items: center; font-weight: 700; font-size: .72rem; font-family: Georgia, serif; }
  .card .why { font-size: .8rem; color: var(--muted); border-top: 1px dashed var(--line); padding-top: .45rem; }
  .lvl { display: inline-block; font-size: .7rem; font-weight: 700; padding: .12rem .5rem; border-radius: 6px; }
  .lvl.Events { background: var(--lvl-events); color: #1f2a44; }
  .lvl.Patterns { background: var(--lvl-patterns); color: #1f2a44; }
  .lvl.Structures { background: var(--lvl-structures); color: #fff; }
  .lvl.Mental { background: var(--lvl-mental); color: #fff; }
  .status { font-size: .75rem; font-weight: 700; }
  .status.active { color: var(--good); }
  .status.pending { color: var(--warn); }

  .commitbar {
    position: sticky; bottom: 0; background: var(--panel); border-top: 1px solid var(--line);
    padding: .8rem 1.2rem; margin: 1.2rem -1.2rem -4rem; display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap;
    box-shadow: 0 -4px 16px rgba(31,42,68,.08);
  }

  .callout { border-radius: 10px; padding: .8rem 1rem; margin-bottom: .7rem; font-size: .92rem; }
  .callout.info { background: #e8eff7; }
  .callout.good { background: var(--good-soft); }
  .callout.warn { background: var(--warn-soft); }
  .callout.bad { background: var(--bad-soft); }

  .chart { width: 100%; height: auto; display: block; }
  .legend { display: flex; gap: 1rem; flex-wrap: wrap; font-size: .8rem; color: var(--muted); }
  .legend i { display: inline-block; width: 18px; height: 4px; border-radius: 2px; vertical-align: middle; margin-right: .35rem; }

  .tabs { display: flex; gap: .4rem; flex-wrap: wrap; border-bottom: 2px solid var(--line); margin-bottom: 1rem; }
  .tabs button { background: none; border: 0; padding: .6rem .9rem; border-bottom: 3px solid transparent; margin-bottom: -2px; font-weight: 600; color: var(--muted); min-height: 44px; }
  .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

  table { border-collapse: collapse; width: 100%; font-size: .88rem; }
  th, td { text-align: left; padding: .5rem .6rem; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { background: var(--bg); }

  .toc { display: grid; grid-template-columns: 1.15fr 1.3fr 1fr 1fr 1fr; gap: .5rem; font-size: .8rem; }
  .toc .head { font-weight: 700; text-transform: uppercase; font-size: .7rem; letter-spacing: .06em; color: var(--muted); padding: .2rem .3rem; }
  .toc .cell { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: .5rem .6rem; }
  .toc .strat { background: var(--ink); color: #fff; font-weight: 700; }
  .toc .goal { grid-column: 1 / -1; background: var(--accent); color: #fff; text-align: center; font-weight: 700; font-size: .95rem; padding: .8rem; border-radius: 10px; }
  .toc ul { margin: 0; padding-left: 1rem; }
  @media (max-width: 900px) { .toc { grid-template-columns: 1fr; } .toc .head { display: none; } .toc .strat { margin-top: .6rem; } }

  .td { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  @media (max-width: 760px) { .td { grid-template-columns: 1fr; } }
  .td .q { border-radius: var(--radius); padding: 1rem; border: 1px solid var(--line); background: var(--panel); }
  .td .q h3 { color: var(--accent); }

  .iceberg { display: grid; gap: 4px; }
  .iceberg > div { border-radius: 6px; padding: .5rem .8rem; display: flex; justify-content: space-between; gap: .5rem; font-size: .88rem; }
  .iceberg > div > b { white-space: nowrap; }
  .iceberg > div.icerow { display: grid; grid-template-columns: minmax(0,1.3fr) minmax(0,1fr); gap: 1.2rem; padding: 1rem 1.2rem; border-radius: 10px; font-size: .92rem; }
  @media (max-width: 700px) { .iceberg > div.icerow { grid-template-columns: 1fr; } }

  .refs p { padding-left: 2rem; text-indent: -2rem; font-size: .85rem; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  footer { text-align: center; font-size: .78rem; color: var(--muted); padding: 1rem; }
  @media print { .topbar, .commitbar, .a11y { display: none; } }
</style>
</head>

<script>

const START_YEAR = 2026;

const BUDGET = 3;              // policy points per year, unspent points carry over

const BASE_TRUE_HARM = 1.45e9; // est. true annual losses of Ontario adults 60+ (reported ~$101M / ~7% reporting)
const BASE_REPORTED = 101e6;   // ~40% of Ontario's ~$258M annualized reported losses (OMERS, 2026)
const BASE_RATE = 0.07;        // CAFC: only 5% to 10% of fraud is reported

const PERSONAS = [
  { id: "margaret", name: "Margaret", age: 81, color: "#c2563a",

  { id: "raj", name: "Raj", age: 72, color: "#2f7d5b",
    blurb: "Moved to Brampton to live near his daughter. More comfortable in Punjabi than English. Uses WhatsApp daily. Banks at a big bank.",

  { id: "denise", name: "Denise", age: 68, color: "#7a4fa0",

const LEVELS = { Events: "Events", Patterns: "Patterns", Structures: "Structures", Mental: "Mental models" };

const CARDS = [
  { id: "ads", name: "TV & radio scam awareness ads", cost: 2, delay: 0, level: "Events", lp: 12, lpName: "Numbers & parameters",

  { id: "pause", name: "Trusted contact + 72-hour pause at Ontario credit unions", cost: 3, delay: 1, level: "Structures", lp: 5, lpName: "Rules",

const EVENTS = [
  { id: "voice", label: "voice clones", counters: ["pause", "calls"], icon: "☎", text: "AI voice cloning makes \"grandparent scams\" sound exactly like family.", mult: { margaret: 1.25, walter: 1.1 } },
  { id: "branch", label: "branch closures", counters: ["peers", "line"], icon: "\u{1F3E6}", text: "Bank branches close across rural Ontario. More seniors are pushed online, often with a stranger's \"help\".", mult: { walter: 1.3, margaret: 1.05 } },
  { id: "deepfake", label: "deepfake ads", counters: ["adsverify", "liability"], icon: "\u{1F4F1}", text: "Deepfake celebrity investment ads flood social media.", mult: { denise: 1.4, raj: 1.15 } },
  { id: "impersonation", label: "government impersonation", counters: ["calls", "line"], icon: "\u{1F310}", text: "Scammers impersonate the CRA and Service Canada in dozens of languages.", mult: { raj: 1.35, walter: 1.1 } },
  { id: "giftcards", label: "gift cards & crypto ATMs", counters: ["liability", "pause"], icon: "\u{1F4B3}", text: "As banks tighten up, scammers shift to gift cards and crypto ATMs.", mult: { margaret: 1.1, raj: 1.1, denise: 1.1, walter: 1.1 } }
];

const BANKISH = ["pause", "calls", "adsverify", "report"];

/* ===================== STATE ===================== */

let S;
let ORDER = EVENTS.map((e, i) => i);     // which scam trend arrives in which year; shuffled every game
function newState() {
  ORDER = EVENTS.map((e, i) => i);
  for (let i = ORDER.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [ORDER[i], ORDER[j]] = [ORDER[j], ORDER[i]]; }
  // forecasts are uncertain: for each coming year, show the real trend and one decoy, in random order
  const forecast = {};
  for (let y = 2; y <= YEARS; y++) {
    const real = ORDER[y - 1];
    const future = ORDER.slice(y - 1).filter(i => i !== real);   // prefer a decoy that hasn't happened yet
    const others = future.length ? future : ORDER.filter(i => i !== real);
    const decoy = others[Math.floor(Math.random() * others.length)];
    forecast[y] = Math.random() < 0.5 ? [real, decoy] : [decoy, real];
  }
  return { year: 0, budget: BUDGET, carry: 0, bonus: 0, picks: {}, history: [], selected: new Set(), filter: "all", forecast };
}
function eventOf(y) { return EVENTS[ORDER[y - 1]]; }

/* ===================== MODEL ===================== */

function readyFor(i, picks) {                // was a counter-measure already working when this trend arrived?
  return EVENTS[ORDER[i]].counters.some(id => isActive(id, i + 1, picks));
}
function threat(pid, y, picks = {}) {
  let t = Math.pow(1.04, y);                 // reported incidents in Ontario more than doubled 2014 to 2024
  for (let i = 0; i < y; i++) {               // a new tactic hits hardest the year it arrives, then settles in
    const m = EVENTS[ORDER[i]].mult[pid] || 1;
    const ready = readyFor(i, picks);         // if you were ready, it never takes hold
    t *= (i === y - 1) ? 1 + (m - 1) * (ready ? 0.5 : 1) : 1 + (m - 1) * (ready ? 0.2 : 0.5);
  }
  return t;
}
function startOf(id, picks) { return picks[id] === undefined ? Infinity : picks[id] + CARD(id).delay; }
function isActive(id, y, picks) { return startOf(id, picks) <= y; }
function CARD(id) { return CARDS.find(c => c.id === id); }

function cardReduction(c, pid, y, picks) {
  if (!isActive(c.id, y, picks) || c.id === "council") return 0;
  let e = (c.effWithPause && isActive("pause", y, picks)) ? c.effWithPause[pid] : (c.eff[pid] || 0);
  if (c.decay) e *= Math.pow(c.decay, y - startOf(c.id, picks));
  let m = 1;
  if (picks.council !== undefined && picks[c.id] >= picks.council) m *= 1.2;
  if (c.id !== "report" && isActive("report", y - 1, picks)) m *= 1.15;
  if (BANKISH.includes(c.id) && isActive("liability", y, picks)) m *= 1.3;
  return Math.min(0.6, e * m);
}

function evaluate(y, picks) {
  const personas = PERSONAS.map(p => {
    const reds = CARDS.map(c => ({ id: c.id, r: cardReduction(c, p.id, y, picks) })).filter(x => x.r > 0).sort((a, b) => b.r - a.r);
    const keep = reds.reduce((acc, x) => acc * (1 - x.r), 1);
    const harm = threat(p.id, y, picks) * keep;
    return { id: p.id, harm, protection: 1 - keep, top: reds };
  });
  const avg = personas.reduce((a, p) => a + p.harm, 0) / personas.length;
  let rate = BASE_RATE;
  CARDS.forEach(c => {
    if (!isActive(c.id, y, picks)) return;
    if (c.id === "liability" && !(isActive("line", y, picks) || isActive("report", y, picks))) return; // UK: 71% of victims never heard of the policy
    rate += c.report || 0;
  });
  rate = Math.min(0.6, rate);
  const trueHarm = BASE_TRUE_HARM * avg;
  const reported = trueHarm * rate;
  const avgProt = personas.reduce((a, p) => a + p.protection, 0) / personas.length;
  let approval = 50 - 15 * Math.log2(reported / BASE_REPORTED) + 12 * avgProt; // headlines punish rising reported losses; people slowly notice they are safer
  CARDS.forEach(c => {
    if (picks[c.id] === undefined || picks[c.id] > y) return;
    if (isActive(c.id, y, picks)) {
      let a = c.approval || 0;
      if (c.decay) a *= Math.pow(c.decay, y - startOf(c.id, picks));
      approval += a;
    } else if (c.approvalPending) approval += c.approvalPending;
  });
  approval = Math.max(5, Math.min(95, approval));
  return { y, personas, avg, rate, trueHarm, reported, approval };
}

function riskLabel(h) { return h >= 0.9 ? "High" : h >= 0.55 ? "Medium" : "Low"; }

  const list = CARDS.filter(c => S.filter === "all" || c.level === S.filter)

  render(`

    const ready = e => e.counters.some(id => S.picks[id] !== undefined && startOf(id, S.picks) <= y + 1);
    const cands = S.forecast[y + 1].map(i => EVENTS[i]);
    return `<div class="callout info" role="note"><b>Forecast for next year (${START_YEAR + y + 1}):</b> analysts expect one of these two trends, but can't say which.
      <ul style="margin:.4rem 0 .2rem;padding-left:1.2rem">${cands.map(e => `<li>${e.icon} ${e.text}${ready(e) ? " <b style='color:var(--good)'>\u2713 you'll be ready for this one</b>" : ""}</li>`).join("")}</ul>
      <span class="small muted">Look for "Counters:" tags on the cards. Most measures take a year to start, so prepare now, spend on today's problem, or find something that covers both.</span></div>`; })() : `<div class="callout info" role="note"><b>Final year: no forecast.</b> The simulation ends after ${START_YEAR + YEARS}, so only measures that work this year will show up in your score. In the real world, slower measures would keep paying off after 2031.</div>`}
  ${hud(ev)}
  <div class="filters" role="group" aria-label="Filter by iceberg level">
    <span class="small muted">Show:</span>
    ${filters.map(([k, l]) => `<button type="button" class="chip" data-f="${k}" aria-pressed="${S.filter === k}">${l}</button>`).join("")}
  </div>
  <div class="who-helps small muted" style="margin-bottom:.7rem">Who each card helps: ${PERSONAS.map(p => `<span class="pdot" style="background:${p.color};color:#fff" aria-hidden="true">${p.name[0]}</span> ${p.name}`).join(" &nbsp;")} &nbsp;|&nbsp; <b>solid</b> = a lot, <b>faded</b> = some, <b>dashed</b> = little or none</div>
  <div class="cards">${list.map(c => cardHtml(c, y)).join("")}</div>
  <div class="commitbar">
    <div><b id="spent">${spent()}</b> of <b>${S.budget}</b> points selected <span class="muted small" id="selnames"></span></div>
    <button class="btn" id="commit">Commit ${START_YEAR + y} plan &rarr;</button>
  </div>`);
  document.querySelectorAll(".chip").forEach(b => b.onclick = () => { S.filter = b.dataset.f; screenYear(); });
  document.querySelectorAll(".card").forEach(b => b.onclick = () => toggleCard(b.dataset.id, b));
  document.getElementById("commit").onclick = commitYear;
  updateCommit();
}

function toggleCard(id, el) {
  const c = CARD(id);
  if (S.selected.has(id)) S.selected.delete(id);
  else {
    if (spent() + c.cost > S.budget) { announce(`Not enough points for ${c.name}.`); el.animate && el.animate([{ transform: "translateX(0)" }, { transform: "translateX(-5px)" }, { transform: "translateX(5px)" }, { transform: "translateX(0)" }], { duration: 220 }); return; }
    S.selected.add(id);
  }
  el.setAttribute("aria-pressed", S.selected.has(id));
  if (c.excludes) {                         // lock or unlock the card it can't be combined with
    const other = document.querySelector(`.card[data-id="${c.excludes}"]`);
    if (other && S.picks[c.excludes] === undefined) {
      const on = S.selected.has(id);
      other.disabled = on; other.classList.toggle("owned", on);
      const note = other.querySelector("[data-excl]");
      if (note) note.textContent = on ? "Blocked: you chose " + c.name.toLowerCase() : "Can't combine with: " + c.name.toLowerCase();
    }
  }
  updateCommit();
}

function updateCommit() {
  document.getElementById("spent").textContent = spent();
  const n = S.selected.size;
  document.getElementById("selnames").textContent = n ? `(${n} measure${n > 1 ? "s" : ""})` : "(none: you can also save points)";
  announce(`${spent()} of ${S.budget} points selected.`);
}

function commitYear() {
  const y = S.year + 1;
  S.selected.forEach(id => S.picks[id] = y);
  S.carry = S.budget - spent();
  S.selected = new Set();
  S.year = y;
  const ev = evaluate(y, S.picks);
  S.history.push(ev);
  S.bonus = ev.approval < APPROVAL_LOW ? -1 : ev.approval > APPROVAL_HIGH ? 1 : 0;
  S.budget = Math.max(0, BUDGET + S.carry + S.bonus);
  screenResults(ev);
}

function personaStory(p, pe, y) {
  const top = pe.top[0];
  if (pe.protection >= 0.4 && top) {
    const story = p.saved[top.id] || `${CARD(top.id).name} kept ${p.name} safe this year.`;
    return { kind: "good", text: story };
  }
  const harm = p.harm[eventOf(y).id];
  if (pe.protection >= 0.18 && top) return { kind: "warn", text: harm + ` <span class="muted">Partly protected: \u201C${CARD(top.id).name}\u201D limited the damage.</span>` };
  return { kind: "bad", text: harm };
}

function insights(ev, prev, y) {
  const out = [];
  const base = evaluate(y, {});
  if (prev && ev.reported > prev.reported * 1.04 && ev.trueHarm < prev.trueHarm) {
    out.push(["info", `<b>Reported losses went up while true harm fell.</b> More victims are reporting, so you can finally see the problem. In a real ministry, this is the year the headlines turn against you. Stay the course.`]);
  }
  const evNow = eventOf(y);
  if (y > 1 && S.forecast[y]) {
    const decoy = EVENTS[S.forecast[y].find(i => i !== ORDER[y - 1])];
    const preparedDecoy = readyFor(y - 1, S.picks) ? [] : decoy.counters.filter(id => isActive(id, y, S.picks));
    out.push(["info", `<b>Forecast check:</b> last year's forecast for ${START_YEAR + y} was ${evNow.label} or ${decoy.label}. It turned out to be <b>${evNow.label}</b>.${preparedDecoy.length ? ` You prepared for ${decoy.label}, so ${preparedDecoy.map(id => CARD(id).name).join(" and ")} isn't wasted: it's already protecting people, and you'll be ready if ${decoy.label} arrives in a later year.` : ""}`]);
  }
  if (y === 1) out.push(["info", `<b>Year one:</b> no one could have prepared for this year's trend. The planning screen forecasts two possible trends for next year, so you can try to get ahead.`]);
  else if (readyFor(y - 1, S.picks)) out.push(["good", `<b>You were ready.</b> ${evNow.counters.filter(id => isActive(id, y, S.picks)).map(id => CARD(id).name).join(" and ")} blunted this year's new scam trend, so it never fully took hold.`]);
  else out.push(["warn", `<b>${START_YEAR + y}'s trend (${evNow.label}) caught Ontario unprepared.</b> It is countered only by ${evNow.counters.map(id => CARD(id).name).join(" or ")}, and neither was working yet, so it will keep doing damage in later years.${CARDS.some(c => isActive(c.id, y, S.picks) && EVENTS.some(e => e.counters.includes(c.id))) ? " The counter-measures you do have cover other trends." : ""}`]);
  const fading = CARDS.filter(c => c.decay && isActive(c.id, y, S.picks) && startOf(c.id, S.picks) < y);
  if (fading.length) out.push(["warn", `<b>${fading.map(c => c.name).join(" and ")} ${fading.length > 1 ? "are" : "is"} fading.</b> Scammers changed their scripts. Shallow measures need to be bought again and again.`]);
  const pending = CARDS.filter(c => S.picks[c.id] !== undefined && startOf(c.id, S.picks) > y && startOf(c.id, S.picks) <= YEARS);
  if (pending.length) out.push(["info", `<b>Delays:</b> ${pending.map(c => `${c.name} (${START_YEAR + startOf(c.id, S.picks)})`).join("; ")}. Meadows warns that delays tempt people to give up on deep fixes too early.`]);
  if (CARDS.some(c => c.approvalPending && S.picks[c.id] !== undefined && !isActive(c.id, y, S.picks))) out.push(["warn", `<b>Industry pushback.</b> Banks and telcos are lobbying against shared liability. Approval dips until the rule takes effect.`]);
  if (y < YEARS && ev.approval < APPROVAL_LOW) out.push(["bad", `<b>Approval is ${Math.round(ev.approval)}%.</b> The Premier's office cuts your budget by 1 point next year. Deep reforms need political room: what will you trade to win it back?`]);
  else if (y < YEARS && ev.approval > APPROVAL_HIGH) out.push(["good", `<b>Approval is ${Math.round(ev.approval)}%.</b> You get 1 extra point next year. Will you spend it on what is popular, or on what works?`]);
  const anyActive = CARDS.some(c => c.id !== "council" && isActive(c.id, y, S.picks));
  if (!anyActive) out.push(["info", `<b>Nothing is working yet.</b> Measures you funded this year start in a later year (see "Works in" on each card), so this year's results are the same as doing nothing.`]);
  const lp = [...ev.personas].sort((a, b) => a.protection - b.protection);
  if (anyActive && lp[lp.length - 1].protection - lp[0].protection > 0.3) out.push(["bad", `<b>Equity check:</b> ${personaById(lp[0].id).name} is ${pct(lp[0].protection)} protected while ${personaById(lp[lp.length - 1].id).name} is ${pct(lp[lp.length - 1].protection)}. Who is your plan leaving behind?`]);
  const vsBase = 1 - ev.trueHarm / base.trueHarm;
  out.push([vsBase > 0.3 ? "good" : "info", `Compared with doing nothing, true harm this year is <b>${pct(Math.max(0, vsBase))} lower</b> (${money(Math.max(0, base.trueHarm - ev.trueHarm))} saved).`]);
  return out;
}

function lineChart(series, opts) {
  const W = 640, H = 220, P = { l: 56, r: 14, t: 14, b: 30 };
  const xs = opts.labels.length;
  const max = Math.max(...series.flatMap(s => s.data)) * 1.1;
  const x = i => P.l + (W - P.l - P.r) * (xs === 1 ? 0.5 : i / (xs - 1));
  const yv = v => H - P.b - (H - P.t - P.b) * (v / max);
  const ticks = [0, .25, .5, .75, 1].map(f => f * max);
  let svg = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.title)}">`;
  ticks.forEach(t => { svg += `<line x1="${P.l}" x2="${W - P.r}" y1="${yv(t)}" y2="${yv(t)}" stroke="var(--line)"/><text x="${P.l - 6}" y="${yv(t) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${opts.fmt(t)}</text>`; });
  opts.labels.forEach((l, i) => { svg += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--muted)">${l}</text>`; });
  series.forEach(s => {
    const pts = s.data.map((v, i) => `${x(i)},${yv(v)}`).join(" ");
    svg += `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="3" ${s.dash ? 'stroke-dasharray="6 5"' : ""} stroke-linejoin="round"/>`;
    s.data.forEach((v, i) => { svg += `<circle cx="${x(i)}" cy="${yv(v)}" r="3.5" fill="${s.color}"><title>${s.name} ${opts.labels[i]}: ${opts.fmt(v)}</title></circle>`; });
  });
  svg += `</svg><div class="legend">${series.map(s => `<span><i style="background:${s.color}"></i>${s.name}</span>`).join("")}</div>`;
  return svg;
}

function trendCharts() {
  const ys = [0, ...S.history.map(h => h.y)];
  const evs = [evaluate(0, {}), ...S.history];
  const labels = ys.map(y => String(START_YEAR + y));
  const base = ys.map(y => evaluate(y, {}).trueHarm);
  return `
  <div class="grid2">
    <div class="panel"><h3>True harm vs doing nothing</h3>
      ${lineChart([{ name: "Your plan", color: "var(--accent)", data: evs.map(e => e.trueHarm) }, { name: "Do nothing", color: "#8a93a6", dash: true, data: base }], { labels, fmt: money, title: "True harm by year" })}
    </div>
    <div class="panel"><h3>What the public sees</h3>
      ${lineChart([{ name: "Reported losses", color: "#24476e", data: evs.map(e => e.reported) }], { labels, fmt: money, title: "Reported losses by year" })}
    </div>
  </div>`;
}

function screenResults(ev) {
  const y = ev.y;
  const prev = S.history.length > 1 ? S.history[S.history.length - 2] : evaluate(0, {});
  const last = y === YEARS;
  render(`
  <div class="eyebrow">Results &middot; ${START_YEAR + y}</div>
  <h2>What happened in ${START_YEAR + y}</h2>
  ${hud(ev)}
  ${insights(ev, prev, y).map(([k, t]) => `<div class="callout ${k}">${t}</div>`).join("")}
  <div class="grid4" style="margin:1rem 0">
    ${PERSONAS.map(p => {
      const pe = ev.personas.find(x => x.id === p.id);
      const st = personaStory(p, pe, y);
      const r = riskLabel(pe.harm);
      return `<div class="persona">
        <div class="who">${avatar(p)}<div><b>${p.name}, ${p.age}</b><br><span class="risk ${r}">${r} risk</span> <span class="small muted">${pct(pe.protection)} protected</span></div></div>
        <div class="callout ${st.kind}" style="margin:0">${st.text}</div>
      </div>`;
    }).join("")}
  </div>
  ${trendCharts()}
  <div class="row"><button class="btn" id="next">${last ? "See your five-year debrief" : "Plan " + (START_YEAR + y + 1)} &rarr;</button></div>`);
  document.getElementById("next").onclick = last ? () => screenDebrief("result") : screenYear;
  announce(`Results for ${START_YEAR + y}. True harm ${money(ev.trueHarm)}.`);
}

/* ===================== DEBRIEF ===================== */

function cumulative(picks) {
  let t = 0;
  for (let y = 1; y <= YEARS; y++) t += evaluate(y, picks).trueHarm;
  return t;
}

function grade() {
  const final = S.history[YEARS - 1];
  const base = evaluate(YEARS, {});
  const red = 1 - final.trueHarm / base.trueHarm;
  const gap = Math.max(...final.personas.map(p => p.harm)) - Math.min(...final.personas.map(p => p.harm));
  const owned = Object.keys(S.picks).map(CARD);
  const deep = owned.filter(c => c.level === "Structures" || c.level === "Mental").reduce((a, c) => a + c.cost, 0);
  const shallow = owned.filter(c => c.level === "Events" || c.level === "Patterns").reduce((a, c) => a + c.cost, 0);
  if (red >= 0.52 && gap < 0.35) return { title: "Systems Shifter", text: "You worked below the waterline and nobody was left far behind. This is what a systems-level response looks like." };
  if (red >= 0.45) return { title: "Structural Reformer", text: "You changed the rules and the money flows. Check the equity gap: someone is still much less protected than the others." };
  if (final.approval >= 50 && red < 0.35) return { title: "Headline Chaser", text: "Approval stayed high, but older Ontarians are still losing most of what they lost before. Visible is not the same as effective." };
  if (shallow > deep) return { title: "Busy but Shallow", text: "Lots of activity at the tip of the iceberg. Scammers adapted faster than your ads and workshops." };
  return { title: "Getting There", text: "You moved some structures, but delays and gaps limited the impact. Try funding slow, deep measures earlier." };
}

function screenDebrief(tab) {
  const tabs = [["result", "Your five years"], ["iceberg", "Iceberg map"], ["toc", "Theory of Change"], ["td", "Transition Design"], ["equity", "Equity lens"], ["frameworks", "Course frameworks"], ["evidence", "Real-world evidence"], ["about", "About & sources"]];
  render(`
  <div class="eyebrow">Debrief</div>
  <h2>From game to systems change</h2>
  <div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button role="tab" data-t="${k}" aria-selected="${tab === k}">${l}</button>`).join("")}</div>
  <div id="tabbody" role="tabpanel"></div>`);
  document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => screenDebrief(b.dataset.t));
  const body = document.getElementById("tabbody");
  const fn = { result: tabResult, iceberg: tabIceberg, toc: tabToC, td: tabTD, equity: tabEquity, frameworks: tabFrameworks, evidence: tabEvidence, about: tabAbout }[tab];
  body.innerHTML = fn();
  const again = document.getElementById("again");
  if (again) again.onclick = () => { S = newState(); screenYear(); };
}

function tabResult() {
  const final = S.history[YEARS - 1];
  const g = grade();
  const saved = cumulative({}) - cumulative(S.picks);
  const owned = Object.keys(S.picks).map(CARD);
  const byLevel = l => owned.filter(c => c.level === l);
  const unused = CARDS.filter(c => S.picks[c.id] === undefined);
  const colors = { Events: "var(--lvl-events)", Patterns: "var(--lvl-patterns)", Structures: "var(--lvl-structures)", Mental: "var(--lvl-mental)" };
  return `
  <div class="hero">
    <div class="panel">
      <div class="eyebrow">Your result</div>
      <h2>${g.title}</h2>
      <p>${g.text}</p>
      <div class="stat"><b>${money(Math.max(0, saved))}</b><span>of harm prevented over five years compared with doing nothing (illustrative).</span></div>
      <div class="stat"><b>${pct(Math.max(0, 1 - final.trueHarm / evaluate(YEARS, {}).trueHarm))}</b><span>lower true harm in 2031 than the do-nothing path.</span></div>
      <div class="stat"><b>${pct(final.rate)}</b><span>of scams now reported (started at ${pct(BASE_RATE)}).</span></div>
      <button class="btn" id="again">Play again with a different strategy</button>
    </div>
    <div class="panel">
      <div class="eyebrow">Where you acted on the iceberg</div>
      <div class="iceberg">
        ${["Events", "Patterns", "Structures", "Mental"].map(l => `<div style="background:${colors[l]};color:${l === "Structures" || l === "Mental" ? "#fff" : "var(--ink)"}"><span><b>${LEVELS[l]}</b>${byLevel(l).length ? ": " + byLevel(l).map(c => c.name).join("; ") : ""}</span><b>${byLevel(l).reduce((a, c) => a + c.cost, 0)} pt</b></div>`).join("")}
      </div>
      <p class="small muted" style="margin-top:.8rem">Deeper levels have more leverage but are harder and slower to change (Donella Meadows Project, n.d.).</p>
      ${unused.length ? `<p class="small"><b>Not funded:</b> ${unused.map(c => c.name).join("; ")}.</p>` : ""}
    </div>
  </div>
  <div class="grid4" style="margin-bottom:1rem">
    ${PERSONAS.map(p => { const pe = final.personas.find(x => x.id === p.id); const r = riskLabel(pe.harm); return `<div class="persona"><div class="who">${avatar(p)}<div><b>${p.name}</b><br><span class="risk ${r}">${r} risk in 2031</span></div></div><p class="small">${pct(pe.protection)} protected. Main protection: ${pe.top[0] ? CARD(pe.top[0].id).name : "none"}.</p></div>`; }).join("")}
  </div>
  ${trendCharts()}
  <div class="panel">
    <h3>The lesson the numbers are built to show</h3>
    <p>Ads, workshops, a shiny app and tougher sentences are cheap, fast and popular, so they feel productive. But they treat scams as an <i>individual knowledge problem</i>. The model rewards changing the system instead: protective defaults where money leaves (trusted contacts, holds), incentives that put costs on those who can prevent scams (shared liability), information flows that end the silence (shame-free reporting), and community structures that reduce isolation (paid peer educators). That is Meadows' insight: most effort goes into the weakest leverage points because they are the most visible.</p>
  </div>`;
}

function tabIceberg() {
  const ICE = {
    Events: { q: "What is happening? What do we see?", items: ["An older adult loses savings to a voice-cloned “grandchild” call", "Fake CRA and bank calls", "Tech-support pop-ups trick people into giving remote access"] },
    Patterns: { q: "What trends are there over time?", items: ["Scams growing in sophistication (AI voice cloning)", "$2.4B+ in reported fraud losses in Canada since 2022 (CAFC, 2026)", "Only 5% to 10% of fraud is ever reported (CAFC, 2026)"] },

}

function tabTD() {
  return `
  <div class="panel">
    <div class="eyebrow">CMU Transition Design Framework (Irwin, Kossoff &amp; Tonkinwise, 2022)</div>
    <h2>Four co-evolving areas, applied</h2>
  </div>
  <div class="td">
    <div class="q"><h3>Vision for transition</h3>
      <p><b>Ontario, 2040:</b> older adults bank, connect and get help online without fear. Every account has a trusted contact by default, a pause before irreversible payments is normal, losses are repaid by whoever could have stopped them, and asking for help carries no shame.</p>
      <p class="small muted">Steps along the pathway: credit union pilot (2027) &rarr; federal age lens (2029) &rarr; shared liability (2030s) &rarr; scams treated as a public-safety system, not personal failure.</p></div>
    <div class="q"><h3>Theories of change</h3>
      <ul>
        <li><b>Systems thinking:</b> act on deep leverage points (rules, information flows, self-organization, paradigms) and expect delays (Meadows, 1999).</li>
        <li><b>Market failure:</b> mend the market by moving the cost onto those who can prevent scams (Beaton &amp; Kennedy, 2021).</li>
        <li><b>Data gap:</b> what is not measured is not designed for (Criado Perez, 2019).</li>
        <li><b>Well-being:</b> connection may protect more than literacy (DeLiema &amp; Sur, 2022).</li>
      </ul></div>
    <div class="q"><h3>Posture &amp; mindset</h3>
      <ul>
        <li><b>Humility:</b> I am a 4th-year engineering student, not an older adult, and I could not interview anyone this term. The game says so, and Strategy 1 hands design power to older adults.</li>
        <li><b>From "helpless senior" to "systems failure":</b> my mother was scammed in her 40s and I was scammed as a computer engineering student. Scams exploit trust and emotion, not age.</li>
        <li><b>Radical collaboration:</b> banks, telcos, platforms, regulators, police and community groups all hold a piece.</li>
        <li><b>The inherited system I am reacting to:</b> industrialization's efficiency logic, now digital-first. Branches close and services move online, designed around a young, tech-savvy default user.</li>
      </ul></div>
    <div class="q"><h3>New ways of designing</h3>
      <ul>
        <li><b>Solve for multiple issues at once:</b> peer educators deliver safety, digital skills and social connection (multifinality).</li>
        <li><b>Grassroots to transition:</b> families already invent code words and \u201Chang up and call back\u201D rules (Manzini's diffuse design). The peer network spreads them; the trusted contact rule turns the same idea into infrastructure.</li>
        <li><b>Amplify what exists:</b> builds on Bill C-15, the CSA trusted contact rule, the Seniors Safety Line and Seniors Active Living Centres instead of starting from scratch.</li>
        <li><b>Long horizons:</b> the game shows why slow, deep measures must start first.</li>
        <li><b>A game as a design tool:</b> policymakers feel the trade-offs between approval, delay and real harm before committing.</li>
      </ul></div>
  </div>`;
}

function tabEquity() {
  return `
  <div class="panel">
    <div class="eyebrow">Inclusive design lens: Equity</div>
    <h2>Who does the current system leave out?</h2>
    <p>"All systems produce what they are designed to produce" (Creative Reaction Lab, 2018). Today's fraud system produces silence, shame and losses that fall almost entirely on victims. Using an equity lens, the question is not "how do we teach seniors?" but "who holds power, and who is at the table?"</p>
  </div>
  <div class="grid2">
    <div class="panel"><h3>Intersections that raise risk</h3>
      <table><thead><tr><th>Persona</th><th>Intersection</th><th>What generic measures miss</th></tr></thead><tbody>
        <tr><td>Margaret</td><td>80+, widowed woman, lives alone</td><td>Women more often outlive partners and live alone; isolation means no one to check with</td></tr>
        <tr><td>Raj</td><td>Newcomer, limited English</td><td>English/French-only ads and workshops; scams arrive in his language first</td></tr>
        <tr><td>Denise</td><td>Confident, recently retired</td><td>"Only vulnerable people get scammed" messaging; shame stops her from reporting</td></tr>
        <tr><td>Walter</td><td>Low income, rural, branch closing</td><td>Online-only help; no in-person bank staff to notice red flags</td></tr>
      </tbody></table>
    </div>
    <div class="panel"><h3>Power and data</h3>
      <ul>
        <li><b>Power:</b> banks, telcos and regulators decide which transactions are flagged and who repays. Older adults are designed <i>for</i>, not <i>with</i> (Aye, 2017). Strategy 1 pays them to co-design.</li>
        <li><b>Data gap:</b> with only 5% to 10% of fraud reported, and data rarely broken down by gender, language or region, the system cannot see who it is failing (Criado Perez, 2019).</li>
        <li><b>The federal strategy is age-blind:</b> its 2026 discussion paper does not mention older adults or trusted contacts (Department of Finance Canada, 2026a).</li>
        <li><b>Designed for, consulted with, or co-creators?</b> Today, older adults are designed for. In this framework they are co-creators with pay and decision power (Strategy 1).</li>
        <li><b>The game itself:</b> adjustable text size, high contrast, keyboard play and plain language, following Microsoft's "solve for one, extend to many" (Microsoft Design, 2016).</li>
      </ul>
    </div>
  </div>
  <div class="panel"><h3>Persona spectrum: design for the barrier, not the label</h3>
    <p class="small">Microsoft Design (2016) shows the same barrier can be permanent, temporary or situational. Scam scripts are built to create situational barriers for anyone, which is why a protection designed for the most excluded protects everyone.</p>
    <table><thead><tr><th>Barrier</th><th>Permanent</th><th>Temporary</th><th>Situational</th></tr></thead><tbody>
      <tr><td><b>Checking a claim</b></td><td>Cognitive decline</td><td>Grief after losing a spouse</td><td>A \u201Cgrandchild\u201D crying on the phone at 2 a.m.</td></tr>
      <tr><td><b>Understanding the message</b></td><td>Hearing loss</td><td>Recovering from surgery, on medication</td><td>A loud call in a second language</td></tr>
      <tr><td><b>Someone to ask</b></td><td>Living alone</td><td>Family away for a month</td><td>Told by the caller to keep it secret</td></tr>
    </tbody></table>
    <p class="small" style="margin-top:.6rem"><b>Solve for one, extend to many:</b> a trusted contact and a pause, designed for someone like Margaret, also stop the stressed 35-year-old being rushed by a fake \u201Cbank investigator\u201D.</p>
  </div>`;
}

function savePref(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* storage may be unavailable */ } }
function loadPref(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

document.querySelectorAll("[data-size]").forEach(b => b.onclick = () => {
  document.documentElement.classList.remove("size-l", "size-xl");
  if (b.dataset.size) document.documentElement.classList.add(b.dataset.size);
  document.querySelectorAll("[data-size]").forEach(x => x.setAttribute("aria-pressed", x === b));
  savePref("trustfall-size", b.dataset.size);
});
const contrastBtn = document.getElementById("contrastBtn");
contrastBtn.onclick = () => {
  const on = document.documentElement.classList.toggle("contrast");
  contrastBtn.setAttribute("aria-pressed", on);
  savePref("trustfall-contrast", on ? "1" : "");
};
(function restore() {
  const size = loadPref("trustfall-size");
  if (size) { const b = document.querySelector(`[data-size="${size}"]`); if (b) b.click(); }
  if (loadPref("trustfall-contrast") === "1") contrastBtn.click();
})();

screenIntro();
